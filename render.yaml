# Render Blueprint — see DEPLOYMENT.md for setup steps and the reasoning behind this shape.
#
# Two web services plus a database. The frontend (nginx) is the only public entry point;
# it reaches the backend over Render's private network (fromService ... property: hostport),
# so the browser only ever talks to one origin and the refresh cookie stays same-site with
# no code changes from local/Docker Compose. The backend is also technically reachable at
# its own public URL — that's fine, since every route still enforces auth itself.
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free # 30-day free Postgres; switch to "starter" for a permanent database

services:
  - type: web
    name: taskflow-backend
    runtime: docker
    plan: free # sleeps after 15 min idle; switch to "starter" to keep it always on
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: "604800"

  - type: web
    name: taskflow-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: taskflow-backend
          type: web
          property: hostport
