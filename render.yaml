# Render Blueprint — see DEPLOYMENT.md for setup steps and the reasoning behind this shape.
#
# Two web services plus a database. The frontend (nginx) is the only public entry point the
# browser ever talks to, so the refresh cookie stays same-site with no code changes from
# local/Docker Compose. It reaches the backend over the backend's own public HTTPS address
# (BACKEND_HOST below) rather than Render's private networking — a private/internal hostname
# either isn't exposed or isn't reliably resolvable for a service of type "web" (as opposed to
# a true private service), so this repo uses the address that's actually proven to work. That's
# fine security-wise: every backend route still enforces auth itself regardless of network path.
databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free # 30-day free Postgres; switch to "starter" for a permanent database

services:
  - type: web
    name: taskflow-backend
    runtime: docker
    plan: free # sleeps after 15 min idle; switch to "starter" to keep it always on
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: "604800"

  - type: web
    name: taskflow-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Set manually on the service, to the backend's own .onrender.com hostname (no scheme,
      # no port, no trailing slash) — see DEPLOYMENT.md. sync: false means the Blueprint
      # declares this variable exists but never sets or overwrites its value, so a dashboard
      # edit here survives every future sync/redeploy instead of being reset back to whatever
      # a wiring directive like fromService would otherwise compute.
      - key: BACKEND_HOST
        sync: false
