server {
    listen __PORT__;
    root /usr/share/nginx/html;
    index index.html;

    # A client-side router: any path that is not a real file falls back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Same origin as the page, so the refresh cookie is first-party and there is no CORS to configure.
    # The upstream below is filled in by docker-entrypoint.sh at container start: docker-compose's
    # "backend:8000" by default, or a host's internal service address — see DEPLOYMENT.md.
    location /api/ws {
        proxy_pass http://__BACKEND_HOST__/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://__BACKEND_HOST__/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
