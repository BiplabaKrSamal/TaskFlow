server {
    listen __PORT__;
    # __RESOLVER__ is the container's own DNS resolver (read from /etc/resolv.conf at start by
    # docker-entrypoint.sh). Paired with the $backend_host variable below, this makes nginx look
    # up the backend at *request time* instead of once when it boots — if the backend service
    # isn't resolvable in the first instant nginx starts (a normal race between two containers
    # coming up together), nginx stays up and serves everything else, and /api/* just works as
    # soon as the backend is actually reachable, no restart needed.
    resolver __RESOLVER__ valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    # A client-side router: any path that is not a real file falls back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Same origin as the page, so the refresh cookie is first-party and there is no CORS to configure.
    # The upstream below is filled in by docker-entrypoint.sh at container start: docker-compose's
    # "backend:8000" by default, or a host's internal service address — see DEPLOYMENT.md.
    set $backend_host __BACKEND_HOST__;

    location /api/ws {
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
