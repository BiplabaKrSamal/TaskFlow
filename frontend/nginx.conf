server {
    listen __PORT__;
    # __RESOLVER__ is the container's own DNS resolver (read from /etc/resolv.conf at start by
    # docker-entrypoint.sh). Paired with the $backend_url variable below, this makes nginx look
    # up the backend at *request time* instead of once when it boots.
    resolver __RESOLVER__ valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    # A client-side router: any path that is not a real file falls back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Same origin as the page, so the refresh cookie is first-party and there is no CORS to configure.
    # The upstream below is filled in by docker-entrypoint.sh: docker-compose's plain
    # "http://backend:8000" locally, or the backend's own public HTTPS address on a host like
    # Render, where a private/internal address either isn't exposed or isn't reliably resolvable
    # for a public-facing service — see DEPLOYMENT.md.
    set $backend_url __BACKEND_URL__;

    location /api/ws {
        proxy_pass $backend_url;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass $backend_url;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
